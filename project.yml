name: Etchost
options:
  bundleIdPrefix: com.borasarang
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: "complete"
    SWIFT_UPCOMING_FEATURE_INFER_SENDABLE_FROM_CAPTURES: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    CODE_SIGN_STYLE: "Manual"
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      DEBUG_INFORMATION_FORMAT: "dwarf"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      STRIP_INSTALLED_PRODUCT: "YES"
      COPY_PHASE_STRIP: "YES"
targets:
  Etchost:
    type: application
    platform: macOS
    sources:
      - Sources/EtchostApp
    resources:
      - Sources/EtchostApp/Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Sources/EtchostApp/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.borasarang.etchost
        PRODUCT_NAME: Etchost
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LSUIElement: "YES"
        NSPrincipalClass: NSApplication
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - target: EtchostKit
  EtchostKit:
    type: framework
    platform: macOS
    sources:
      - Sources/EtchostKit
    resources:
      - Sources/EtchostKit/Resources
    settings:
      base:
        SKIP_INSTALL: "YES"
        BUILD_LIBRARY_FOR_DISTRIBUTION: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        INFOPLIST_FILE: Sources/EtchostKit/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.borasarang.etchost.kit
  EtchostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/EtchostKitTests
    resources:
      - Tests/EtchostKitTests/Resources
    dependencies:
      - target: EtchostKit
    settings:
      base:
        TEST_HOST: ""
        INFOPLIST_FILE: Tests/EtchostKitTests/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.borasarang.etchost.tests
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
schemes:
  Etchost:
    build:
      targets:
        Etchost: all
    test:
      targets:
        - EtchostTests
    run:
      config: Debug
    archive:
      config: Release
